# Deploys the site to Hostinger on every push to main (or by hand from the Actions tab).
# It rebuilds the pages, gathers only the public files into public/, and uploads them
# over encrypted FTP (FTPS). Only changed files are sent after the first run.
#
# One-time setup (GitHub repo → Settings → Secrets and variables → Actions):
#   Secrets:   FTP_SERVER     your Hostinger FTP host, e.g. ftp.yourdomain.com or the IP shown in hPanel
#              FTP_USERNAME   your Hostinger FTP username, e.g. u123456789
#              FTP_PASSWORD   your Hostinger FTP password
#   Variable:  FTP_SERVER_DIR the folder to upload into (default: public_html/). See README.md.
name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

# never run two deploys at once
concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check FTP details are set up
        id: check
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_SERVER" ] || [ -z "$FTP_USERNAME" ] || [ -z "$FTP_PASSWORD" ]; then
            echo "::warning::Skipping deploy: add FTP_SERVER, FTP_USERNAME and FTP_PASSWORD under Settings → Secrets and variables → Actions."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22

      - name: Build pages and gather public files
        if: steps.check.outputs.ready == 'true'
        run: |
          node src/build.js
          node tools/package.js

      - name: Upload to Hostinger
        if: steps.check.outputs.ready == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./public/
          server-dir: ${{ vars.FTP_SERVER_DIR || 'public_html/' }}
